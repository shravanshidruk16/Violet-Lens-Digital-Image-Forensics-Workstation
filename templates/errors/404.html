<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Record Not Found — Violet Lens</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="error-page">
    <div class="error-card">
        <div class="error-badge">Error 404</div>
        <h1>Examination Record Not Found</h1>
        <p class="error-desc">{{ error.description if error and error.description else 'The requested examination identifier does not exist or has expired in accordance with local evidence retention policies.' }}</p>
        <div class="error-actions">
            <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Workspace</a>
        </div>
    </div>
</body>
</html>
